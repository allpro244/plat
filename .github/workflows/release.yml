name: release
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10 --activate
      - name: Setup Godot
        run: sudo bash tools/setup-linux.sh
      - name: Build release zips
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ "$VERSION" = "$GITHUB_REF_NAME" ] && VERSION="dev-${GITHUB_SHA:0:7}"
          bash tools/package-release.sh "$VERSION"
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: plat-downloads
          path: dist/releases/*.zip
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            --repo "${{ github.repository }}" \
            --title "plat ${GITHUB_REF_NAME}" \
            --notes "Double-click download — unzip, open PLAY.txt, run plat.exe (Windows) or plat.x86_64 (Linux). No Godot or Node install needed." \
            "dist/releases/plat-win64-${VER}.zip" \
            "dist/releases/plat-linux64-${VER}.zip"
